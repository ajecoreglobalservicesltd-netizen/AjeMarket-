<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AjeMarket Diagnostic</title><style>body{font-family:Arial;background:#f5f7fa;margin:0;padding:20px}.box{max-width:700px;margin:20px auto;background:#fff;padding:24px;border-radius:16px}#status{padding:15px;background:#eef2f6;border-radius:10px;font-weight:bold;margin:15px 0}pre{white-space:pre-wrap;word-break:break-word;background:#101820;color:#fff;padding:15px;border-radius:10px}button{padding:12px 18px;background:#06243b;color:#fff;border:0;border-radius:9px}</style></head><body><div class="box"><h1>AjeMarket</h1><p>Supabase connection diagnostic</p><div id="status">Testing Supabase...</div><pre id="result">Please wait...</pre><button onclick="testConnection()">Test Again</button></div><script>

</script></body></html>
