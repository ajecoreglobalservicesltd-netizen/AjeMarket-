<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AjeMarket</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#142033}
header{background:#06233b;color:white;padding:16px;position:sticky;top:0;z-index:5}
nav{max-width:1050px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-size:25px;font-weight:800}.logo b{color:#43d5bd}.search{flex:1;min-width:180px;padding:12px;border:0;border-radius:9px}
button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}
.cart{background:white;color:#06233b}.hero{max-width:1050px;margin:22px auto;padding:30px 20px;border-radius:18px;background:linear-gradient(135deg,#06233b,#087c72);color:white}
.hero h1{margin:0 0 10px;font-size:32px}.wrap{max-width:1050px;margin:auto;padding:0 20px 40px}
.filters{display:flex;gap:8px;overflow:auto;margin:18px 0}.filters button{background:white;border:1px solid #ddd;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 14px #0001}.pic{height:140px;background:#e9eff4;display:grid;place-items:center;font-size:55px}
.card div:last-child{padding:14px}.price{font-size:19px;font-weight:800;margin:9px 0}.add{width:100%;background:#06233b;color:white}
.drawer{position:fixed;right:-410px;top:0;width:min(400px,92vw);height:100%;background:white;z-index:10;padding:20px;box-shadow:-5px 0 25px #0003;transition:.25s;overflow:auto}.drawer.open{right:0}
.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.emoji{font-size:30px}.grow{flex:1}.total{font-size:21px;font-weight:800;margin:20px 0}.checkout{width:100%;background:#07876f;color:white}.muted{color:#687386;font-size:13px}.empty{text-align:center;padding:35px;color:#687386}
</style></head><body>
<header><nav><div class="logo">Aje<b>Market</b></div><input id="search" class="search" placeholder="Search products"><button class="cart" onclick="openCart()">Cart (<span id="count">0</span>)</button></nav></header>
<section class="hero"><div class="wrap" style="padding:0"><h1>Welcome to AjeMarket</h1><p>Shop products from your phone with this marketplace prototype.</p><button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Start shopping</button></div></section>
<main class="wrap"><div class="filters">
<button onclick="cat='All';render()">All</button><button onclick="cat='Electronics';render()">Electronics</button><button onclick="cat='Home';render()">Home</button><button onclick="cat='Fashion';render()">Fashion</button>
</div><div id="products" class="grid"></div></main>
<aside id="drawer" class="drawer"><button onclick="closeCart()">Close</button><h2>Your Cart</h2><div id="items"></div><div id="total" class="total">Total: ₦0</div><button class="checkout" onclick="checkout()">Proceed to checkout</button></aside>
<script>
const P=[
[1,'Smartphone',285000,'Electronics','📱'],[2,'Headphones',45000,'Electronics','🎧'],[3,'Power Bank',28000,'Electronics','🔋'],
[4,'Office Chair',95000,'Home','🪑'],[5,'Table Lamp',18000,'Home','💡'],[6,'Sneakers',65000,'Fashion','👟'],[7,'Backpack',32000,'Fashion','🎒']];
let cart=JSON.parse(localStorage.cart||'[]'),cat='All';
const money=n=>'₦'+n.toLocaleString('en-NG');
function render(){let q=search.value.toLowerCase();products.innerHTML=P.filter(x=>(cat==='All'||x[3]===cat)&&x[1].toLowerCase().includes(q)).map(x=>`<article class="card"><div class="pic">${x[4]}</div><div><div class="muted">${x[3]}</div><h3>${x[1]}</h3><div class="price">${money(x[2])}</div><button class="add" onclick="add(${x[0]})">Add to cart</button></div></article>`).join('')||'<div class="empty">No products found.</div>';cartView()}
function add(id){let x=cart.find(a=>a.id===id);x?x.q++:cart.push({id,q:1});save()}
function save(){localStorage.cart=JSON.stringify(cart);cartView()}
function cartView(){count.textContent=cart.reduce((a,x)=>a+x.q,0);items.innerHTML=cart.length?cart.map(i=>{let p=P.find(x=>x[0]===i.id);return `<div class="item"><div class="emoji">${p[4]}</div><div class="grow"><b>${p[1]}</b><br>${money(p[2])}<br><button onclick="chg(${p[0]},-1)">−</button> ${i.q} <button onclick="chg(${p[0]},1)">+</button></div></div>`}).join(''):'<div class="empty">Your cart is empty.</div>';let t=cart.reduce((a,i)=>a+P.find(x=>x[0]===i.id)[2]*i.q,0);total.textContent='Total: '+money(t)}
function chg(id,n){let x=cart.find(a=>a.id===id);x.q+=n;if(x.q<1)cart=cart.filter(a=>a.id!==id);save()}
function openCart(){drawer.classList.add('open')}function closeCart(){drawer.classList.remove('open')}
function checkout(){alert(cart.length?'Checkout demo. Real payment integration can be connected next.':'Your cart is empty.')}
search.oninput=render;render();
</script></body></html>
