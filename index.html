<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AjeMarket</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fa;color:#102033}header{background:#06243b;color:#fff;padding:15px}.nav{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.logo{font-size:26px;font-weight:800}.logo b{color:#22d3b2}.search{flex:1;min-width:180px;background:#fff;border-radius:10px;display:flex}.search input{width:100%;padding:12px;border:0;outline:0}.cart{padding:12px 17px;border:0;border-radius:10px;font-weight:bold}.hero{max-width:1100px;margin:20px auto;padding:35px 25px;border-radius:22px;color:white;background:linear-gradient(120deg,#06324d,#087f7a)}.hero h1{font-size:40px}.wrap{max-width:1100px;margin:auto;padding:0 15px 40px}.notice{background:#e7faf5;padding:12px;border-radius:9px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border-radius:15px;overflow:hidden}.pic{height:175px;background:#edf2f7;display:flex;align-items:center;justify-content:center;font-size:60px}.info{padding:14px}.tag{color:#087f7a;font-size:13px;font-weight:bold}.name{font-size:18px;font-weight:bold;margin:7px 0}.price{font-size:20px;font-weight:bold;margin:10px 0}.add{width:100%;padding:12px;border:0;border-radius:9px;background:#06243b;color:#fff;font-weight:bold}.cats{display:flex;gap:9px;overflow:auto;padding:10px 0 18px}.cat{background:#fff;border:1px solid #d8e0e8;padding:11px 17px;border-radius:11px;font-weight:bold;white-space:nowrap}.active{background:#06243b!important;color:#fff}.empty{text-align:center;color:#687586;padding:35px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{gap:10px}.pic{height:135px}.name{font-size:16px}}
</style></head>
<body>
<header><div class="nav"><div class="logo">Aje<b>Market</b></div><div class="search"><input id="search" placeholder="Search products..."></div><button class="cart">Cart (0)</button></div></header>
<section class="hero"><div class="wrap"><h1>Shop smarter with AjeMarket</h1><p>Products are loaded from your AjeMarket database.</p></div></section>
<div class="wrap"><div class="notice">Database: <b id="status">Connecting...</b></div><div id="cats" class="cats"></div><h2>Products</h2><div id="products" class="grid"></div></div>
<script>
const URL="https://zeyoecwbndiocsaqlnuk.supabase.co";
const KEY="PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE";
let data=[],cat="All";
async function load(){try{let r=await fetch(URL+"/rest/v1/products?select=*&order=created_at.desc",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!r.ok)throw 0;data=await r.json();status.textContent="Connected";cats.innerHTML=["All",...new Set(data.map(x=>x.category))].map(x=>'<button class="cat '+(x==cat?'active':'')+'" onclick="cat=\''+x+'\';render()">'+x+'</button>').join("");render()}catch(e){status.textContent="Not connected yet";products.innerHTML='<div class="empty" style="grid-column:1/-1">Add your Supabase Publishable key to this file before uploading it.</div>'}}
function render(){let q=search.value.toLowerCase(),a=data.filter(x=>(cat=="All"||x.category==cat)&&(!q||x.name.toLowerCase().includes(q)));products.innerHTML=a.length?a.map(x=>'<article class="card"><div class="pic">'+(x.image_url?'<img src="'+x.image_url+'" style="max-width:100%;max-height:100%">':'🛍️')+'</div><div class="info"><div class="tag">'+x.category+'</div><div class="name">'+x.name+'</div><div class="price">₦'+Number(x.price).toLocaleString("en-NG")+'</div><button class="add">Add to cart</button></div></article>').join(""):'<div class="empty" style="grid-column:1/-1">No products found.</div>'}
search.addEventListener("input",render);load();
</script></body></html>
