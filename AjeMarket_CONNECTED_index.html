<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AjeMarket</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fa;color:#102033}header{background:#06243b;color:#fff;padding:15px}.nav{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.logo{font-size:26px;font-weight:800}.logo b{color:#22d3b2}.search{flex:1;min-width:180px;background:#fff;border-radius:10px}.search input{width:100%;padding:12px;border:0;outline:0}.cart{padding:12px;border:0;border-radius:10px;font-weight:bold}.hero{max-width:1100px;margin:20px auto;padding:35px 25px;border-radius:22px;color:#fff;background:linear-gradient(120deg,#06324d,#087f7a)}.hero h1{font-size:40px}.wrap{max-width:1100px;margin:auto;padding:0 15px 40px}.notice{background:#e7faf5;padding:12px;border-radius:9px;margin:15px 0}.cats{display:flex;gap:9px;overflow:auto;padding:10px 0 18px}.cat{background:#fff;border:1px solid #d8e0e8;padding:11px 17px;border-radius:11px;font-weight:bold;white-space:nowrap}.active{background:#06243b!important;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 10px #0001}.pic{height:175px;background:#edf2f7;display:flex;align-items:center;justify-content:center;font-size:60px}.info{padding:14px}.tag{color:#087f7a;font-size:13px;font-weight:bold}.name{font-size:18px;font-weight:bold;margin:7px 0}.price{font-size:20px;font-weight:bold;margin:10px 0}.add{width:100%;padding:12px;border:0;border-radius:9px;background:#06243b;color:#fff;font-weight:bold}.empty{text-align:center;color:#687586;padding:35px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="nav"><div class="logo">Aje<b>Market</b></div><div class="search"><input id="search" placeholder="Search products..."></div><button class="cart">Cart (0)</button></div></header>
<section class="hero"><div class="wrap"><h1>Shop smarter with AjeMarket</h1><p>Discover products from sellers on AjeMarket.</p></div></section>
<div class="wrap"><div class="notice">Database: <b id="status">Connecting...</b></div><div id="cats" class="cats"></div><h2>Products</h2><div id="products" class="grid"></div></div>
<script>
const SUPABASE_URL="https://zeyoecwbndiocsaqlnuk.supabase.co", KEY="sb_publishable_2QQNc64ugY41jjlvCcsnqw_bFHyQsyz";
let data=[],cat="All";
async function load(){try{let r=await fetch(SUPABASE_URL+"/rest/v1/products?select=*&order=created_at.desc",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!r.ok)throw Error(r.status);data=await r.json();status.textContent="Connected";renderCats();render()}catch(e){status.textContent="Connection error";products.innerHTML='<div class="empty" style="grid-column:1/-1">Unable to load products.</div>';console.error(e)}}
function renderCats(){let a=["All",...new Set(data.map(x=>x.category).filter(Boolean))];cats.innerHTML=a.map(x=>'<button class="cat '+(x==cat?"active":"")+'" onclick="cat='+JSON.stringify(x)+';renderCats();render()">'+x+'</button>').join("")}
function render(){let q=search.value.toLowerCase(),a=data.filter(x=>(cat=="All"||x.category==cat)&&(!q||x.name.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)));products.innerHTML=a.length?a.map(x=>'<article class="card"><div class="pic">'+(x.image_url?'<img src="'+x.image_url+'" style="max-width:100%;max-height:100%;object-fit:contain">':'🛍️')+'</div><div class="info"><div class="tag">'+x.category+'</div><div class="name">'+x.name+'</div><div class="price">₦'+Number(x.price).toLocaleString("en-NG")+'</div><button class="add">Add to cart</button></div></article>').join(""):'<div class="empty" style="grid-column:1/-1">No products found.</div>'}
search.addEventListener("input",render);load();
</script></body></html>
