<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AjeMarket — Account</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">A</span>AjeMarket</a><a href="index.html">Marketplace</a></header><main class="auth-page"><section class="auth-card"><h1 id="authTitle">Welcome to AjeMarket</h1><p id="authSub">Create an account to sell products and manage your listings.</p><div id="authMessage" class="notice hidden"></div><form id="authForm"><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></label><label id="nameField">Full name<input id="fullName" placeholder="Your name"></label><button class="primary full" type="submit" id="authBtn">Create account</button></form><button class="text-btn" id="toggleMode">Already have an account? Log in</button><div id="loggedIn" class="hidden"><h2>Your account</h2><p id="userEmail"></p><a class="primary full as-button" href="sell.html">Create a listing</a><button class="danger full" id="logout">Log out</button></div></section></main><script src="account.js"></script></body></html>
